[package]
name = "pace"
version = "0.1.0"
description = "Pace: a desk timer that paces your day around your deadlines"
edition = "2021"

[lib]
name = "pace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
